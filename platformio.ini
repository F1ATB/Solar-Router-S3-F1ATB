; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0


board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram = enabled
board_build.filesystem = littlefs
board_build.partitions = src/partitions.csv
build_flags = 
	-DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
	-DVERSION=${this.custom_prog_version}
	-D PROG_VERSION=\"${this.custom_prog_version}\"
    -D BUILD_DATE=\"${sysenv.DATE}\"
	-Wno-deprecated-declarations

lib_deps = 
	https://github.com/mathieucarbou/ESPAsyncWebServer
  	https://github.com/mathieucarbou/AsyncTCP
	moononournation/GFX Library for Arduino
	knolleary/PubSubClient
	plageoj/UrlEncode
	bblanchon/ArduinoJson
	olikraus/U8g2 
	mandulaj/PZEM-004T-v30 
	milesburton/DallasTemperature
	paulstoffregen/OneWire@^2.3.8
	links2004/WebSockets

extra_scripts = 
    pre:tools/embed_web.py
	pre:tools/extra_script.py
	post:tools/merge_bin.py
custom_prog_version = V1.00-beta.12

